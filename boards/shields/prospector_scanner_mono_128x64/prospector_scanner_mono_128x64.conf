# Prospector Scanner OLED - nice!nano v2 + 1.3" SH1106 128x64 mono OLED (I2C).
# Monochrome LVGL status display driven by the BLE status-advertisement scanner.

# --- BLE scanner (receive keyboard status advertisements) ---
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_PROSPECTOR_MODE_SCANNER=y
# Mono OLED has no touch panel.
CONFIG_PROSPECTOR_TOUCH_ENABLED=n

# --- Display + LVGL ---
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_LVGL=y

# SH1106/SSD1306 monochrome display driver
CONFIG_SSD1306=y

# Custom status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Dedicated display work queue
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# LVGL memory, widgets, and a crisp native 1bpp font (anti-aliased fonts look
# sparse at 1bpp). Canvas/image/line are needed by the ported dongle_display
# widgets (battery canvas, modifier/output icons + selection lines).
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_LINE=y
CONFIG_LV_USE_ANIMIMG=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_MAIN_STACK_SIZE=4096

# The battery widget is gated on CONFIG_ZMK_BATTERY in the status-screen layout;
# enable it so the widget is assembled (it displays keyboard batteries from the
# advertisement, not the scanner's own).
CONFIG_ZMK_BATTERY=y

# Monochrome displays need a full-frame draw buffer so the whole panel (and the
# mono conversion buffer) render in one pass. Set VDB to 100% directly, matching
# englmaxi's dongle_display config. NOTE: do NOT use LV_Z_FULL_REFRESH instead --
# forcing full-refresh MODE breaks the mono conversion on this stack (renders as
# horizontal stripes); only the buffer size needs to be full-frame.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=148

# --- Buses ---
CONFIG_I2C=y
CONFIG_GPIO=y

# --- Not a keyboard: no split, no HID subsystems needed ---
CONFIG_ZMK_SPLIT=n

# --- Unused peripherals (this scanner has no SPI/PWM/LED/touch) ---
CONFIG_SPI=n
CONFIG_PWM=n
CONFIG_LED=n
CONFIG_ZMK_STUDIO=n
CONFIG_PM_DEVICE=n

# Display power management. ZMK blanks OLED (SSD1306/SH1106) displays on idle by
# default (ZMK_DISPLAY_BLANK_ON_IDLE=y for SSD1306). A scanner has no local key
# activity, so scanner_activity.c feeds received keyboard advertisements into
# ZMK's activity monitor: the panel stays on while the paired keyboard is
# broadcasting and idle-blanks (power save) only when it's gone. The timeout
# must exceed the keyboard's idle advertisement interval (default 30s) so an
# idle-but-present keyboard keeps the panel on; 90s gives margin for a missed ad.
CONFIG_ZMK_IDLE_TIMEOUT=90000
# No deep sleep: it would power down the BLE radio, so the scanner could never
# hear the keyboard to wake itself (idle blanking keeps the radio scanning).
CONFIG_ZMK_SLEEP=n
