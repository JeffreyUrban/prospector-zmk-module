# Prospector Scanner OLED - nice!nano v2 + 1.3" SH1106 128x64 mono OLED (I2C).
# Monochrome LVGL status display. The status screen is currently a minimal
# placeholder; scanner data widgets are added on top of this.

# --- Display + LVGL ---
CONFIG_DISPLAY=y
CONFIG_ZMK_DISPLAY=y
CONFIG_LVGL=y

# SH1106/SSD1306 monochrome display driver
CONFIG_SSD1306=y

# Custom status screen
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# Dedicated display work queue
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# LVGL memory, widgets, and a crisp native 1bpp font (anti-aliased fonts look
# sparse at 1bpp).
CONFIG_LV_Z_MEM_POOL_SIZE=16384
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_MAIN_STACK_SIZE=4096

# Monochrome displays need a full-frame draw buffer so the whole panel (and the
# mono conversion buffer) render in one pass. Set VDB to 100% directly, matching
# englmaxi's dongle_display config. NOTE: do NOT use LV_Z_FULL_REFRESH instead --
# forcing full-refresh MODE breaks the mono conversion on this stack (renders as
# horizontal stripes); only the buffer size needs to be full-frame.
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=148

# --- Buses ---
CONFIG_I2C=y
CONFIG_GPIO=y

# --- Not a keyboard: no split, no HID subsystems needed ---
CONFIG_ZMK_SPLIT=n

# --- Unused peripherals (this scanner has no SPI/PWM/LED/touch) ---
CONFIG_SPI=n
CONFIG_PWM=n
CONFIG_LED=n
CONFIG_ZMK_STUDIO=n
CONFIG_PM_DEVICE=n

# A scanner display has no key activity, so the default idle timeout would blank
# the OLED. Use a long timeout to keep the panel on.
CONFIG_ZMK_IDLE_TIMEOUT=1800000
